name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build site
        env:
          GITALK_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}
        run: |
          # 这一行会把 secret 在日志里变成 ***
          echo "::add-mask::$GITALK_SECRET"
          # 用 sed 直接替换 hugo.toml 中的 clientSecret
          sed -i "s|clientSecret = \"\"|clientSecret = \"$GITALK_SECRET\"|" hugo.toml
          # 现在构建
          HUGO_ENV=production hugo